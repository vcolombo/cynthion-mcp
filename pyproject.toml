[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cynthion-mcp"
version = "0.1.0"
description = "MCP server exposing Cynthion USB capture and decoder capabilities."
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "oliver" }]
dependencies = [
    "mcp==1.27.1",
    "pyusb==1.3.1",
    "libusb1==3.3.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
cynthion-mcp = "cynthion_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
